# Credible on Fly.io.
#
#   fly launch --copy-config --no-deploy   # pick a region, keep this config
#   fly volumes create credible_data --size 1
#   fly deploy
#   fly logs                               # the first-run account creation link
#
# Note the volume: SQLite needs real local disk, so the app is pinned to a
# single machine in a single region. Do not scale this to multiple machines —
# they would each get their own separate database.

app = "credible"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  CREDIBLE_DATA_DIR = "/data"
  CREDIBLE_HOST = "0.0.0.0"
  CREDIBLE_PORT = "8000"
  # Fly terminates TLS at the edge and forwards the real client IP.
  CREDIBLE_TRUST_PROXY = "true"
  CREDIBLE_SECURE_COOKIES = "true"
  # Set this to your real hostname, e.g. "https://stats.example.com".
  CREDIBLE_BASE_URL = "https://credible.fly.dev"

[[mounts]]
  source = "credible_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # An analytics endpoint must never be asleep: a suspended machine drops the
  # pageviews it was meant to record, and a cold start delays the rest.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
