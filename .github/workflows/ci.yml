name: CI

on:
  push:
    branches: [main]
  pull_request:

# No dependencies means no install step and no cache — a run is a checkout,
# a Node runtime, and the test suite.
jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the first release where node:sqlite works without a flag.
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show versions
        run: node --version

      - name: Verify there are no dependencies
        # The zero-dependency promise is a feature, so it is enforced here
        # rather than trusted. Fails if anything appears in package.json.
        # --input-type=module because the project is ESM and never uses require().
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
            const deps = Object.keys({ ...pkg.dependencies, ...pkg.devDependencies });
            if (deps.length) {
              console.error('Credible must have zero dependencies, found: ' + deps.join(', '));
              process.exit(1);
            }
            console.log('Zero dependencies confirmed.');
          "

      - name: Run tests
        # Bare `node --test` uses the runner's own file discovery, which behaves
        # the same on every supported release. Passing a directory
        # (`node --test test/`) is not portable: Node 26 resolves the argument
        # as a module and fails with MODULE_NOT_FOUND.
        run: node --test

      - name: Build the browser tracker
        run: node tracker/build.js

      - name: Check the built tracker is committed
        # public/js/cr.js is served directly to browsers, so the build output
        # must be committed and match what tracker/build.js produces. If this
        # fails, run `node tracker/build.js` and commit the result.
        run: git diff --exit-code public/js/cr.js
